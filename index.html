    <script>
      (function() {
        var isExt = function(s) {
          var str = String(s || '');
          return str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('Could not establish connection') !== -1 ||
                 str.indexOf('Receiving end does not exist') !== -1;
        };
        window.addEventListener('error', function(e) {
          if (isExt(e.message) || isExt(e.filename) || (e.error && isExt(e.error.stack))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = reason && (reason.message || reason.stack) ? (reason.message || reason.stack) : String(reason || '');
          if (isExt(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
